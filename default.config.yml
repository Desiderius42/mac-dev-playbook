---
downloads: ~/.ansible-downloads/

configure_dotfiles: false
configure_terminal: true
configure_osx: false
configure_rust: true

# Set to 'true' to configure the Dock via dockutil.
configure_dock: false
dockitems_remove: []
# - Launchpad
# - TV
# - Podcasts
# - 'App Store'
dockitems_persist: []
# - name: "Sublime Text"
#   path: "/Applications/Sublime Text.app/"
#   pos: 5

configure_sudoers: false
sudoers_custom_config: ''
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL
 # dotfiles_repo: https://github.com/geerlingguy/dotfiles.git
 # dotfiles_repo_accept_hostkey: true
 # dotfiles_repo_local_destination: ~/Development/GitHub/dotfiles
 # dotfiles_files:
 # - .bash_profile
 # - .gitignore
 # - .inputrc
 # - .osx


homebrew_installed_packages:
  # Shell & git
  - bash-completion
  - zsh-history-substring-search
  - git-lfs
  - github/gh/gh
  - gnupg
  - ssh-copy-id
  - vim
  - wget
  # Build tools (native compilation)
  - autoconf
  - cmake
  - ninja
  - gettext
  - openssl
  - readline
  # JS / React Native
  - node
  - nvm
  - watchman
  # Java (Gradle / Android)
  - openjdk@17
  # iOS device logs
  - libimobiledevice
  # Python / MCP Ouroboros
  - python
  - uv
  # Ansible
  - mas
  - yamllint
  # --- Décommentez pour réinstaller ---
  # - asciidoc
  # - ccache
  # - clang-format
  # - doxygen
  # - exercism
  # - gcc
  # - git-flow
  # - imagemagick
  # - iperf
  # - lcov
  # - libevent
  # - lynx
  # - markdown
  # - mcrypt
  # - mercurial
  # - nmap
  # - qt
  # - wrk

homebrew_taps:
#  - homebrew/cask
# https://formulae.brew.sh/analytics/cask-install/365d/
homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  # IDE / éditeurs
  - visual-studio-code
  - sublime-text
  # Dev tools
  - docker
  - sourcetree
  - android-studio
  # Navigateur (debug web / docs)
  - google-chrome
  # Communication pro
  - slack
  - zoom
  # --- Décommentez pour réinstaller ---
  # - adobe-acrobat-reader
  # - anki
  # - discord
  # - dropbox
  # - electrum
  # - evernote
  # - google-drive
  # - grandperspective
  # - ledger-live
  # - ltspice
  # - macfuse
  # - meld
  # - microsoft-teams
  # - notion
  # - plex
  # - plex-media-server
  # - projectlibre
  # - protonmail-bridge
  # - resilio-sync
  # - sabnzbd
  # - shadow
  # - simple-comic
  # - steam
  # - suspicious-package
  # - todoist
  # - transmission
  # - vlc
  # - whatsapp
  # - xmind

# See `geerlingguy.mas` role documentation for usage instructions.
mas_installed_apps:
  - {id: 497799835, name: "Xcode"}
  # --- Décommentez pour réinstaller ---
  # - {id: 517914548, name: "Dashlane"}
  # - {id: 1176895641, name: "Spark"}

mas_email: ""
mas_password: ""
osx_script: "~/.osx --no-restart"

# Install packages from other package managers.
# Note: You are responsible for making sure the required package managers are
# installed, eg. through homebrew.
composer_packages: []
# - name: drush
#   state: present # present/absent, default: present
#   version: "^8.1" # default: N/A
gem_packages:
  - name: cocoapods
    state: present
npm_packages:
  - name: "@anthropic-ai/claude-code"
    state: present
pip_packages: []
# - name: mkdocs
#   state: present # present/absent/latest, default: present
#   version: "0.16.3" # default: N/A

# Set to 'true' to configure Sublime Text.
configure_sublime: false
sublime_base_path: '~/Library/Application Support/Sublime Text'
sublime_config_path: "Packages/User"
sublime_package_control:
  - "DocBlockr"
  - "Dockerfile Syntax Highlighting"
  - "FileDiffs"
  - "GitHub Flavored Markdown Preview"
  - "Jinja2"
  - "Package Control"
  - "PHP-Twig"
  - "Pretty JSON"
  - "SublimeLinter"
  - "SublimeLinter-contrib-yamllint"
  - "TrailingSpaces"
  - "WordCount"

# Glob pattern to ansible task files to run after all other tasks are finished.
post_provision_tasks: []
